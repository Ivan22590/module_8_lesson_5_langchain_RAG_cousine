services:
  bot:
    build: .
    container_name: rag-telegram-bot
    # .env локально обязателен, а на сервере Coolify может генерировать свой —
    # делаем файл необязательным, чтобы деплой не падал (переменные
    # контейнер получает из окружения/сгенерированного .env).
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
